<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>German Dictation App - Deutsch Dictate | Created by Fahim Rahimi</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 6px;
      font-size: 0.95rem;
    }
    textarea, select, input[type="range"] {
      width: 100%;
    }
    textarea {
      min-height: 130px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
    }
    select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 0.95rem;
    }
    .checkbox-box {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .checkbox-box input {
      width: auto;
      margin-top: 3px;
      transform: scale(1.15);
    }
    .checkbox-box label {
      margin: 0;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      color: var(--text);
    }
    .btn-blue { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-blue:hover { background: var(--primary-hover); }
    .btn-green { background: var(--success); color: #fff; border-color: var(--success); }
    .btn-brown { background: var(--warning); color: #fff; border-color: var(--warning); }
    .status-box {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
    }
    .status-text {
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }
    .preview-sentence {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>1. Paste Your German Text (Empty Box)</h1>
    <textarea id="textInput" placeholder="Paste or type German sentences here..."></textarea>

    <label for="voiceSelect">German Voice:</label>
    <select id="voiceSelect">
      <option value="">Default German Voice (de-DE)</option>
    </select>

    <label for="speedRange">Speed: <span id="speedLabel">0.55x (Very Slow)</span></label>
    <input id="speedRange" type="range" min="0.4" max="1.3" step="0.05" value="0.55" />

    <label for="repeatSelect">Repeats per Sentence:</label>
    <select id="repeatSelect">
      <option value="1">1 time</option>
      <option value="2" selected>2 times (Recommended)</option>
      <option value="3">3 times</option>
    </select>

    <label for="pauseSelect">Pause Between Repeats:</label>
    <select id="pauseSelect">
      <option value="1">1 second</option>
      <option value="2">2 seconds</option>
      <option value="3">3 seconds</option>
      <option value="5" selected>5 seconds</option>
    </select>

    <div class="checkbox-box">
      <input id="punctuationCheck" type="checkbox" checked />
      <label for="punctuationCheck">Read punctuation aloud in German (Punkt, Komma, Fragezeichen, Ausrufezeichen)</label>
    </div>

    <div class="checkbox-box">
      <input id="autoNextCheck" type="checkbox" />
      <label for="autoNextCheck">Automatically move to next sentence after repeats finish</label>
    </div>

    <div class="btn-row">
      <button id="playSentenceBtn" class="btn-blue" type="button">Play Sentence</button>
      <button id="verySlowRepeatBtn" class="btn-green" type="button">Very Slow + Repeat</button>
      <button id="playAgainBtn" class="btn-brown" type="button">Play Current Again</button>
      <button id="stopBtn" type="button">Stop</button>
      <button id="clearBtn" type="button">Clear Source</button>
    </div>

    <div class="status-box">
      <div id="statusText" class="status-text">Ready — Sentence 0 of 0</div>
      <div id="sentencePreview" class="preview-sentence"></div>
      <div class="btn-row" style="margin-top: 0;">
        <button id="prevBtn" type="button">Prev</button>
        <button id="nextBtn" type="button">Next</button>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedRange = document.getElementById("speedRange");
    const speedLabel = document.getElementById("speedLabel");
    const repeatSelect = document.getElementById("repeatSelect");
    const pauseSelect = document.getElementById("pauseSelect");
    const punctuationCheck = document.getElementById("punctuationCheck");
    const autoNextCheck = document.getElementById("autoNextCheck");

    const playSentenceBtn = document.getElementById("playSentenceBtn");
    const verySlowRepeatBtn = document.getElementById("verySlowRepeatBtn");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const stopBtn = document.getElementById("stopBtn");
    const clearBtn = document.getElementById("clearBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const statusText = document.getElementById("statusText");
    const sentencePreview = document.getElementById("sentencePreview");

    let sentences = [];
    let currentIndex = 0;
    let currentRepeat = 1;
    let pauseTimer = null;
    let isPlaying = false;
    let sessionId = 0;

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = speechSynthesis.getVoices();
      const germanVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("de"));
      const previousVal = voiceSelect.value;

      voiceSelect.innerHTML = '<option value="">Default German Voice (de-DE)</option>';
      germanVoices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });

      if (previousVal) {
        voiceSelect.value = previousVal;
      }
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function splitSentences(raw) {
      const cleaned = raw.replace(/\s+/g, " ").trim();
      if (!cleaned) return [];
      const matches = cleaned.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g);
      return matches ? matches.map(s => s.trim()).filter(Boolean) : [];
    }

    function updateStatus(extra = "") {
      if (!sentences.length) {
        statusText.textContent = "Ready — Sentence 0 of 0";
        sentencePreview.textContent = "";
        return;
      }
      const base = `Sentence ${currentIndex + 1} of ${sentences.length}`;
      statusText.textContent = extra ? `${base} — ${extra}` : base;
      sentencePreview.textContent = sentences[currentIndex] || "";
    }

    function syncSentences(resetIndex = true) {
      sentences = splitSentences(textInput.value);
      if (!sentences.length) {
        currentIndex = 0;
        currentRepeat = 1;
        updateStatus();
        return;
      }
      if (resetIndex) {
        currentIndex = 0;
      } else if (currentIndex >= sentences.length) {
        currentIndex = sentences.length - 1;
      }
      currentRepeat = 1;
      updateStatus();
    }

    function buildSpokenText(sentence) {
      if (!punctuationCheck.checked) return sentence;
      let spoken = sentence
        .replace(/,/g, " Komma ")
        .replace(/\?/g, " Fragezeichen ")
        .replace(/!/g, " Ausrufezeichen ")
        .replace(/\./g, " Punkt ");
      return spoken.replace(/\s+/g, " ").trim();
    }

    function clearTimers() {
      if (pauseTimer) {
        clearTimeout(pauseTimer);
        pauseTimer = null;
      }
    }

    function stopSpeech(updateLabel = true) {
      sessionId++;
      isPlaying = false;
      clearTimers();
      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }
      if (updateLabel) {
        updateStatus("Stopped");
      }
    }

    function speakCurrentRepeat(activeSession) {
      if (activeSession !== sessionId || !isPlaying) return;
      if (!("speechSynthesis" in window)) {
        statusText.textContent = "Speech synthesis is not supported in this browser.";
        return;
      }
      if (!sentences.length) {
        updateStatus("No text found");
        return;
      }

      const maxRepeats = parseInt(repeatSelect.value, 10) || 1;
      const pauseSec = parseInt(pauseSelect.value, 10) || 0;
      const rawSentence = sentences[currentIndex];
      const textToSpeak = buildSpokenText(rawSentence);

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "de-DE";
      utterance.rate = parseFloat(speedRange.value) || 0.55;

      if (voiceSelect.value) {
        const chosen = speechSynthesis.getVoices().find(v => v.name === voiceSelect.value);
        if (chosen) utterance.voice = chosen;
      }

      updateStatus(`Reading (${currentRepeat}/${maxRepeats})...`);

      utterance.onend = () => {
        if (activeSession !== sessionId || !isPlaying) return;

        if (currentRepeat < maxRepeats) {
          currentRepeat++;
          updateStatus(`Pausing ${pauseSec}s before repeat...`);
          pauseTimer = setTimeout(() => {
            if (activeSession !== sessionId || !isPlaying) return;
            speakCurrentRepeat(activeSession);
          }, pauseSec * 1000);
        } else if (autoNextCheck.checked && currentIndex + 1 < sentences.length) {
          currentIndex++;
          currentRepeat = 1;
          updateStatus(`Moving to sentence ${currentIndex + 1}...`);
          pauseTimer = setTimeout(() => {
            if (activeSession !== sessionId || !isPlaying) return;
            speakCurrentRepeat(activeSession);
          }, 600);
        } else {
          isPlaying = false;
          updateStatus("Finished sentence");
        }
      };

      utterance.onerror = () => {
        if (activeSession !== sessionId) return;
        isPlaying = false;
        updateStatus("Speech error — tap Play again");
      };

      speechSynthesis.speak(utterance);
    }

    function startSentence(index, forceAutoNext = null) {
      stopSpeech(false);
      syncSentences(false);
      if (!sentences.length) return;

      currentIndex = Math.max(0, Math.min(index, sentences.length - 1));
      currentRepeat = 1;
      if (typeof forceAutoNext === "boolean") {
        autoNextCheck.checked = forceAutoNext;
      }

      isPlaying = true;
      sessionId++;
      speakCurrentRepeat(sessionId);
    }

    function formatSpeedLabel(val) {
      const num = parseFloat(val);
      if (num <= 0.65) return `${num.toFixed(2)}x (Very Slow)`;
      if (num <= 0.85) return `${num.toFixed(2)}x (Slow)`;
      return `${num.toFixed(2)}x (Normal)`;
    }

    speedRange.addEventListener("input", () => {
      speedLabel.textContent = formatSpeedLabel(speedRange.value);
    });

    textInput.addEventListener("input", () => {
      stopSpeech(false);
      syncSentences(true);
    });

    playSentenceBtn.addEventListener("click", () => {
      startSentence(currentIndex);
    });

    verySlowRepeatBtn.addEventListener("click", () => {
      speedRange.value = "0.50";
      speedLabel.textContent = formatSpeedLabel("0.50");
      if (parseInt(repeatSelect.value, 10) < 2) {
        repeatSelect.value = "2";
      }
      startSentence(currentIndex, true);
    });

    playAgainBtn.addEventListener("click", () => {
      startSentence(currentIndex);
    });

    stopBtn.addEventListener("click", () => {
      stopSpeech(true);
    });

    clearBtn.addEventListener("click", () => {
      stopSpeech(false);
      textInput.value = "";
      syncSentences(true);
    });

    prevBtn.addEventListener("click", () => {
      const prevIdx = currentIndex > 0 ? currentIndex - 1 : 0;
      startSentence(prevIdx);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex + 1 < sentences.length) {
        startSentence(currentIndex + 1);
      } else {
        stopSpeech(false);
        updateStatus("Reached last sentence");
      }
    });

    syncSentences(true);
  </script>
</body>
</html>
